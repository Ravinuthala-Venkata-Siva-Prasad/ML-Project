
name: Deploy Student Performance Prediction to AWS ECS Express

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: student-performance-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: student-performance-prediction
  ECS_SERVICE_ARN: arn:aws:ecs:ap-southeast-2:316992254617:service/default/simple-docker-service-06ffe82bb7d7-0d7b

jobs:
  deploy:
    name: Build and Deploy to AWS
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build -t "$IMAGE" .
          docker push "$IMAGE"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy to ECS Express
        env:
          IMAGE: ${{ steps.build-image.outputs.image }}
        run: |
          set -euo pipefail

          aws ecs update-express-gateway-service \
            --service-arn "$ECS_SERVICE_ARN" \
            --primary-container "image=$IMAGE,containerPort=5000,awsLogsConfiguration={logGroup=/aws/ecs/default/simple-docker-service-06ffe82bb7d7-0d7b-dc5b,logStreamPrefix=ecs}" \
            --region "$AWS_REGION" \
            --no-cli-pager

      - name: Show ECS Express status
        run: |
          aws ecs describe-express-gateway-service \
            --service-arn "$ECS_SERVICE_ARN" \
            --region "$AWS_REGION" \
            --query "service.status" \
            --output json \
            --no-cli-pager
